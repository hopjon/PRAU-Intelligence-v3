<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRAU Intelligence</title>

    <meta name="theme-color" content="#111111">

    <link rel="icon" href="images/prau-logo.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
     <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/people.css/people.css">
    <link rel="stylesheet" href="css/vehicles.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>
    <div id="app"></div>
    <div id="appFooter" style="position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:10px;
      letter-spacing:1px;color:#8a6c0a;padding:8px 0;background:rgba(10,10,10,0.9);z-index:50;pointer-events:none;">
      PRAU Intelligence v3.1.0 · INTERNAL USE ONLY · © 2026 PRAU Intelligence
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Face matching engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/human/3.3.6/human.js"></script>

    <!-- Firebase -->
    <script type="module" src="js/firebase.js"></script>

    <!-- Application -->
    <script type="module" src="js/app.js"></script>
<div id="imageViewer" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;align-items:center;justify-content:center;">
  <button id="imageViewerClose" style="position:absolute;top:16px;right:16px;width:42px;height:42px;border:none;border-radius:50%;background:rgba(255,255,255,0.16);color:#fff;font-size:24px;cursor:pointer;z-index:2;">✕</button>
  <button id="imageViewerPrev" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,0.16);color:#fff;font-size:22px;cursor:pointer;z-index:2;">‹</button>
  <button id="imageViewerNext" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,0.16);color:#fff;font-size:22px;cursor:pointer;z-index:2;">›</button>
  <div id="imageViewerStage" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;">
    <img id="imageViewerImg" style="max-width:90%;max-height:90%;object-fit:contain;border-radius:8px;">
  </div>
  <div id="imageViewerCounter" style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:13px;"></div>
</div>
</body>
</html>
